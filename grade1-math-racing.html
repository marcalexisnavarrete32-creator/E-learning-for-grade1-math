<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo Math | Grade 1 Mathematics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --font:'Nunito',sans-serif;--head:'Racing Sans One',cursive;--bg:#2b2d33;--text:#f5f5f5;--title:#ffd60a;--card:#ffffff;--ink:#1c1c1f;--bw:4px;--r:14px;--shadow:0 7px 0 #e63946;--choice:#ffd60a;--right:#5ee08a;--btn:#ffd60a;--focus:#ffd60a;--c1:#e63946;--c2:#ffd60a;--c3:#4dabf7;--c4:#ff922b;--c5:#69db7c;--c6:#f5f5f5; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; font-family: var(--font); font-weight: 600; font-size: 20px; color: var(--text); background: var(--bg); }
  header, main { max-width: 860px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
  header { padding-top: 24px; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  main { padding-bottom: 48px; }
  h1 { margin: 0; font-family: var(--head); font-weight: 400; font-size: clamp(1.8rem, 6.5vw, 3rem); color: var(--title); line-height: 1.1; }
  .score { background: var(--card); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 999px; padding: 4px 18px; font-weight: 800; }
  .hello { font-size: 1.25rem; margin: 6px 0 22px; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; }
  .topic { font: inherit; font-weight: 800; font-size: 1.35rem; color: var(--ink); cursor: pointer; text-align: center; border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 20px 10px; box-shadow: var(--shadow); transition: transform .12s; }
  .topic:hover { transform: translateY(-3px); }
  .topic .ico { display: block; font-size: 2.8rem; line-height: 1.2; }
  .topic small { display: block; font-weight: 600; font-size: .95rem; }
  .card { background: var(--card); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; text-align: center; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .prompt { font-family: var(--head); font-weight: 400; font-size: clamp(1.6rem, 5.5vw, 2.4rem); margin: 8px 0; }
  .visual { min-height: 110px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; font-size: 2.6rem; margin: 8px 0 16px; }
  .visual .gone { opacity: .25; filter: grayscale(1); }
  .visual svg { width: 160px; height: 160px; }
  .choices { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .choice { font: inherit; font-weight: 800; font-size: 2rem; min-width: 96px; padding: 8px 22px; cursor: pointer; background: var(--choice); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: calc(var(--r) * .7); box-shadow: 0 5px 0 var(--ink); }
  .choice:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .choice.right { background: var(--right); }
  .choice.wrong { background: #d8d8d8; color: #888; animation: shake .3s; }
  .choice:disabled { cursor: default; }
  .msg { min-height: 34px; margin-top: 16px; font-size: 1.4rem; font-weight: 800; }
  .btn { font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--ink); background: var(--btn); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 16px; margin: 4px; }
  .btn.big { font-size: 1.2rem; padding: 10px 24px; }
  .stars { font-size: 2.6rem; }
  button:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  body::before{content:'';display:block;height:26px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/26px 26px}h1{font-style:italic;letter-spacing:.03em}.topic{transform:skewX(-6deg)}.topic:hover{transform:skewX(-6deg) translateY(-3px)}
</style>
</head>
<body>

<header>
  <h1>Turbo Math 🏎️</h1>
  <div class="score" aria-live="polite">⭐ <span id="total">0</span></div>
</header>

<main>
  <section id="home">
    <p class="hello">Start your engines! Pick a lane and race to the finish.</p>
    <div class="menu">
      <button class="topic" style="background:var(--c1)" data-mode="count"><span class="ico">🍎</span>Counting<small>How many?</small></button>
      <button class="topic" style="background:var(--c2)" data-mode="add"><span class="ico">➕</span>Adding<small>Put together</small></button>
      <button class="topic" style="background:var(--c3)" data-mode="sub"><span class="ico">➖</span>Taking away<small>How many left?</small></button>
      <button class="topic" style="background:var(--c4)" data-mode="compare"><span class="ico">⚖️</span>Bigger or smaller<small>Compare numbers</small></button>
      <button class="topic" style="background:var(--c5)" data-mode="shape"><span class="ico">🔷</span>Shapes<small>Name the shape</small></button>
      <button class="topic" style="background:var(--c6)" data-mode="clock"><span class="ico">🕒</span>Clocks<small>What time is it?</small></button>
    </div>
  </section>

  <section id="game" class="card" hidden>
    <div class="top">
      <button class="btn" id="back">⬅ Home</button>
      <span id="progress"></span>
      <button class="btn" id="listen" aria-label="Read the question aloud">🔊 Listen</button>
    </div>
    <div class="prompt" id="prompt"></div>
    <div class="visual" id="visual"></div>
    <div class="choices" id="choices"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div id="end" hidden>
      <button class="btn big" id="again">Play again</button>
      <button class="btn big" id="home2">Home</button>
    </div>
  </section>
</main>

<script>
  var PRAISE = ["Vroom! 🏎️", "Fast and correct! 🏁", "You win the lap! 🏆", "Turbo boost! 🔥"];
  var EMO = ["🚗", "🏎️", "🚚", "🚓", "🚒", "🛞"];
  var TOTAL_Q = 5;
  var st = { mode: "count", i: 0, score: 0, stars: 0, q: null, first: true };
  var $ = function (id) { return document.getElementById(id); };
  function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
  function pick(a) { return a[rnd(0, a.length - 1)]; }
  function shuffle(a) { return a.sort(function () { return Math.random() - 0.5; }); }
  function speak(t) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t); u.rate = 0.85; speechSynthesis.speak(u);
  }
  function emojis(n, e, faded) {
    var s = "";
    for (var i = 0; i < n; i++) s += '<span class="' + (i >= n - (faded || 0) ? "gone" : "") + '">' + e + "</span>";
    return s;
  }
  function numOpts(ans, max) {
    var set = [ans];
    while (set.length < 3) {
      var v = ans + rnd(-3, 3);
      if (v >= 0 && v <= max && set.indexOf(v) < 0) set.push(v);
    }
    return shuffle(set).map(function (n) { return { label: String(n), ok: n === ans }; });
  }
  function strOpts(ans, pool) {
    var others = shuffle(pool.filter(function (x) { return x !== ans; })).slice(0, 2);
    return shuffle([ans].concat(others)).map(function (x) { return { label: x, ok: x === ans }; });
  }
  var SHAPES = {
    circle: '<circle cx="50" cy="50" r="40"/>',
    square: '<rect x="14" y="14" width="72" height="72"/>',
    triangle: '<polygon points="50,10 92,88 8,88"/>',
    rectangle: '<rect x="6" y="26" width="88" height="48"/>',
    star: '<polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38"/>'
  };
  function clockSvg(h) {
    var s = '<svg viewBox="0 0 200 200" role="img" aria-label="A clock"><circle cx="100" cy="100" r="92" fill="#fff" stroke="#222" stroke-width="8"/>';
    for (var n = 1; n <= 12; n++) {
      var a = n * Math.PI / 6;
      s += '<text x="' + (100 + 72 * Math.sin(a)) + '" y="' + (100 - 72 * Math.cos(a) + 7) + '" font-size="20" text-anchor="middle" font-weight="800" fill="#222">' + n + "</text>";
    }
    var ha = h * Math.PI / 6;
    s += '<line x1="100" y1="100" x2="' + (100 + 44 * Math.sin(ha)) + '" y2="' + (100 - 44 * Math.cos(ha)) + '" stroke="#e63946" stroke-width="9" stroke-linecap="round"/>';
    s += '<line x1="100" y1="100" x2="100" y2="34" stroke="#222" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#222"/></svg>';
    return s;
  }
  var makers = {
    count: function () {
      var n = rnd(1, 10);
      return { prompt: "How many can you count?", say: "How many can you count?", visual: emojis(n, pick(EMO)), options: numOpts(n, 10) };
    },
    add: function () {
      var a = rnd(1, 8), b = rnd(1, 10 - a), e = pick(EMO);
      return { prompt: a + " + " + b + " = ?", say: a + " plus " + b + " equals what?", visual: emojis(a, e) + "<b>+</b>" + emojis(b, e), options: numOpts(a + b, 10) };
    },
    sub: function () {
      var a = rnd(2, 10), b = rnd(1, a - 1);
      return { prompt: a + " − " + b + " = ?", say: a + " minus " + b + " equals what?", visual: emojis(a, pick(EMO), b), options: numOpts(a - b, 10) };
    },
    compare: function () {
      var x = rnd(1, 20), y = rnd(1, 20), big = Math.random() < 0.5;
      while (y === x) y = rnd(1, 20);
      var w = big ? "bigger" : "smaller", ans = big ? Math.max(x, y) : Math.min(x, y);
      return { prompt: "Which number is " + w + "?", say: "Which number is " + w + "?", visual: "",
        options: shuffle([x, y]).map(function (n) { return { label: String(n), ok: n === ans }; }) };
    },
    shape: function () {
      var names = Object.keys(SHAPES), name = pick(names);
      return { prompt: "What shape is this?", say: "What shape is this?",
        visual: '<svg viewBox="0 0 100 100" role="img" aria-label="A shape" fill="' + pick(["#ff8a3d", "#2ec4b6", "#ff6fb5", "#9b8cff", "#f5c542"]) + '" stroke="#222" stroke-width="4">' + SHAPES[name] + "</svg>",
        options: strOpts(name, names) };
    },
    clock: function () {
      var h = rnd(1, 12), pool = [];
      for (var i = 1; i <= 12; i++) pool.push(i + " o'clock");
      return { prompt: "What time is it?", say: "What time is it?", visual: clockSvg(h), options: strOpts(h + " o'clock", pool) };
    }
  };
  function show(id) { ["home", "game"].forEach(function (s) { $(s).hidden = s !== id; }); }
  function start(mode) { st.mode = mode; st.i = 0; st.score = 0; $("end").hidden = true; $("choices").hidden = false; show("game"); next(); }
  function next() {
    if (st.i >= TOTAL_Q) return finish();
    st.i++; st.first = true; st.q = makers[st.mode]();
    $("progress").textContent = "Question " + st.i + " of " + TOTAL_Q;
    $("prompt").textContent = st.q.prompt;
    $("visual").innerHTML = st.q.visual;
    $("msg").textContent = "";
    var box = $("choices"); box.innerHTML = "";
    st.q.options.forEach(function (o) {
      var b = document.createElement("button");
      b.className = "choice"; b.textContent = o.label;
      b.addEventListener("click", function () { answer(b, o); });
      box.appendChild(b);
    });
  }
  function answer(b, o) {
    if (o.ok) {
      b.classList.add("right");
      document.querySelectorAll(".choice").forEach(function (x) { x.disabled = true; });
      $("msg").textContent = pick(PRAISE);
      if (st.first) { st.score++; st.stars++; $("total").textContent = st.stars; }
      setTimeout(next, 1200);
    } else {
      st.first = false; b.classList.add("wrong"); b.disabled = true;
      $("msg").textContent = "Oops! Try again 💪";
    }
  }
  function finish() {
    var s = "";
    for (var i = 0; i < TOTAL_Q; i++) s += i < st.score ? "⭐" : "☆";
    $("prompt").textContent = "All done! 🎉";
    $("visual").innerHTML = '<span class="stars">' + s + "</span>";
    $("choices").hidden = true; $("progress").textContent = "";
    $("msg").textContent = st.score === TOTAL_Q ? "Perfect! You are a math star!" : "You got " + st.score + " out of " + TOTAL_Q + " on the first try.";
    $("end").hidden = false;
  }
  document.querySelectorAll("[data-mode]").forEach(function (b) { b.addEventListener("click", function () { start(b.dataset.mode); }); });
  function home() { if ("speechSynthesis" in window) speechSynthesis.cancel(); show("home"); }
  $("back").addEventListener("click", home);
  $("home2").addEventListener("click", home);
  $("again").addEventListener("click", function () { start(st.mode); });
  $("listen").addEventListener("click", function () { if (st.q) speak(st.q.say); });
</script>
</body>
</html>
